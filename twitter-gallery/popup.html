<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmarks Gallery</title>
    <style>
      body {
        margin: 0;
        min-width: 260px;
        padding: 16px;
        background: #000;
        color: #e7e9ea;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 17px;
      }
      p {
        margin: 0 0 14px;
        color: #8b98a5;
      }
      button {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 10px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border: 1px solid #536471;
        color: #e7e9ea;
      }
      #status:empty {
        display: none;
      }
      label.toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid #2f3336;
        cursor: pointer;
      }
      label.toggle small {
        display: block;
        color: #8b98a5;
      }
      label.toggle input {
        width: 22px;
        height: 22px;
        accent-color: #ff3b30;
      }
    </style>
  </head>
  <body>
    <h1>Bookmarks Gallery</h1>
    <p>See the photos and videos in your X bookmarks as a grid.</p>
    <p id="status"></p>
    <button id="open">Open gallery</button>
    <button id="goto" class="secondary">Go to my bookmarks</button>
    <label class="toggle">
      <span>Floating button on X<small>A ball you can drag anywhere; tap it to open the gallery.</small></span>
      <input type="checkbox" id="fab" />
    </label>
    <script src="popup.js"></script>
  </body>
</html>
