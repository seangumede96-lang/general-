<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmarks Gallery</title>
    <style>
      body {
        margin: 0;
        min-width: 260px;
        padding: 16px;
        background: #000;
        color: #e7e9ea;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 17px;
      }
      p {
        margin: 0 0 14px;
        color: #8b98a5;
      }
      button {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 10px;
        border: 0;
        border-radius: 999px;
        background: #1d9bf0;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border: 1px solid #536471;
        color: #e7e9ea;
      }
      #status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Bookmarks Gallery</h1>
    <p>See the photos and videos in your X bookmarks as a grid.</p>
    <p id="status"></p>
    <button id="open">Open gallery</button>
    <button id="goto" class="secondary">Go to my bookmarks</button>
    <script src="popup.js"></script>
  </body>
</html>
